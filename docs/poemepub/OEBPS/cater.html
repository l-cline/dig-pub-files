			<div id="div1-2">
				<h1 class="head_one style1">Caterpillar</p>
				<h1 class="head_one style2">Christina Rossetti</p>
				<p class="Body style3">Brown and furry</p>
				<p class="Body style3">Caterpillar in a hurry,</p>
				<p class="Body style3">Take your walk</p>
				<p class="Body style3">To the shady leaf, or stalk,</p>
				<p class="Body style3">Or what not,</p>
				<p class="Body style3">Which may be the chosen spot.</p>
				<p class="Body style3">No toad spy you,</p>
				<p class="Body style3">Hovering bird of prey pass by you;</p>
				<p class="Body style3">Spin and die,</p>
				<p class="Body style3">To live again a butterfly.</p>

			</div>
